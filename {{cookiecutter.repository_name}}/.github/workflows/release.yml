---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@dfd7769f7126d48787f809d3aa54facc942c86f2 # 7.10.2
    with:
      version: ${{ '{{' }} inputs.version {{ '}}' }}
