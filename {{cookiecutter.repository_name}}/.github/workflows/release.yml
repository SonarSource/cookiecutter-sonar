---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@88db3da262751434aba7139cdfd7299c7c1cefec # 7.9.0
    with:
      version: ${{ '{{' }} inputs.version {{ '}}' }}
