---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@1bcca53e8f2da38e1e131d6d23224a3f613160cb # 7.10.4
    with:
      version: ${{ '{{' }} inputs.version {{ '}}' }}
